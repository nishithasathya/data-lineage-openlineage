services:
  marquez-db:
    image: postgres:14
    container_name: marquez-db
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    ports:
      - "5432:5432"
    volumes:
      - marquez-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez -d marquez"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  marquez-api:
    image: marquezproject/marquez:0.50.0
    container_name: marquez-api
    depends_on:
      marquez-db:
        condition: service_healthy
    environment:
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    ports:
      - "5002:5000"
      - "5001:5001"
    restart: unless-stopped

  marquez-web:
    image: marquezproject/marquez-web:0.50.0
    container_name: marquez-web
    depends_on:
      - marquez-api
    environment:
      MARQUEZ_HOST: marquez-api
      MARQUEZ_PORT: 5000
      WEB_PORT: 3000
    ports:
      - "3001:3000"
    restart: unless-stopped

  spark:
    image: apache/spark:3.5.6
    container_name: lineage-spark
    entrypoint: ["/bin/bash", "-lc"]
    command: ["sleep infinity"]
    working_dir: /opt/project
    volumes:
      - .:/opt/project
    depends_on:
      - marquez-api
    restart: unless-stopped

volumes:
  marquez-db-data: